# Local MySQL experiment. Activate explicitly with --spring.profiles.active=mysql.
# Optional, git-ignored credentials file, relative to the backend working directory.
spring.config.import=optional:file:./.mysql-local.properties
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/legal_intake_lab?connectionTimeZone=Asia/Seoul&createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

# Keep experiment records across restarts. Only use the dedicated lab schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.h2.console.enabled=false
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
