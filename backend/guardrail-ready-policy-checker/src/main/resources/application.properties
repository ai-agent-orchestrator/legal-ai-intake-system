
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:h2:mem:observability_practice;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.ohgiraffers.handlermethod.support.SqlStatementInspector
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.ohgiraffers.handlermethod=INFO
logging.pattern.level=%5p [traceId=%X{traceId:-none}]

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=ai-agent-security-observability-lab
management.info.env.enabled=true

info.app.name=ai-agent-security-observability-lab
info.app.description=AI agent security observability lab for metric combinations and guardrail-ready policy checks

# JWT is enabled for the new legal API. Set JWT_SECRET outside the repository in real deployments.
jwt.secret=${JWT_SECRET:ZGV2LWxhdy1jaGF0LWp3dC1zZWNyZXQta2V5LW11c3QtYmUtMzJieXRlcw==}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}

# NeMo Guardrails adapter endpoint. The Python service is started separately.
guardrails.base-url=${NEMO_GUARDRAILS_URL:http://localhost:8000}

# OpenAI-compatible LLM endpoint. Keep the API key outside Git.
llm.base-url=${LLM_BASE_URL:https://api.openai.com}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:gpt-4o-mini}
llm.system-prompt=${LLM_SYSTEM_PROMPT:You are a cautious legal procedure assistant. Provide general legal information, avoid definitive outcomes, protect personal data, and recommend a qualified professional for case-specific advice.}
llm.max-output-tokens=${LLM_MAX_OUTPUT_TOKENS:512}
llm.request-timeout-ms=${LLM_REQUEST_TIMEOUT_MS:30000}
llm.streaming.chunk-size=${LLM_STREAMING_CHUNK_SIZE:50}
llm.streaming.context-size=${LLM_STREAMING_CONTEXT_SIZE:20}

# Application-side cost control. Prices are configurable estimates for the selected model.
llm.cost.monthly-budget-usd=${LLM_MONTHLY_BUDGET_USD:7}
llm.cost.input-usd-per-1k-tokens=${LLM_INPUT_USD_PER_1K_TOKENS:0.15}
llm.cost.output-usd-per-1k-tokens=${LLM_OUTPUT_USD_PER_1K_TOKENS:0.60}
