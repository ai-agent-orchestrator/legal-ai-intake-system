
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:h2:mem:observability_practice;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.ohgiraffers.handlermethod.support.SqlStatementInspector
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Uploaded files are stored as JPA BLOBs in the current database.
intake.documents.max-bytes=${INTAKE_DOCUMENT_MAX_BYTES:5242880}
spring.servlet.multipart.max-file-size=${INTAKE_MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${INTAKE_MULTIPART_MAX_REQUEST_SIZE:6MB}

# Screen 07: a memo with the same author and content inside this window (seconds) is treated as a resend
# when the client did not send an Idempotency-Key. This is a compatibility fallback for keyless callers, not a
# permanent idempotency guarantee: after the window the same content is saved again. Intake submissions dedupe
# only by Idempotency-Key. See docs/intake-idempotency-concurrency.md.
intake.memo.resubmit-window-seconds=${INTAKE_MEMO_RESUBMIT_WINDOW_SECONDS:120}

logging.level.com.ohgiraffers.handlermethod=INFO
logging.pattern.level=%5p [traceId=%X{traceId:-none}]

management.endpoints.web.exposure.include=health,info,metrics,prometheus,guardtimeseries
# Existing Prometheus server; fixed read-only range query, ADMIN Basic via Actuator.
observability.prometheus.base-url=${PROMETHEUS_BASE_URL:http://127.0.0.1:9090}
observability.prometheus.job=${PROMETHEUS_JOB:legal-ai-intake}
management.endpoint.health.show-details=always
management.metrics.tags.application=ai-agent-security-observability-lab
management.info.env.enabled=true

info.app.name=ai-agent-security-observability-lab
info.app.description=AI agent security observability lab for metric combinations and guardrail-ready policy checks

# JWT is enabled for the new legal API. Set JWT_SECRET outside the repository in real deployments.
jwt.secret=${JWT_SECRET:ZGV2LWxhdy1jaGF0LWp3dC1zZWNyZXQta2V5LW11c3QtYmUtMzJieXRlcw==}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}

# NeMo Guardrails adapter endpoint. The Python service is started separately.
guardrails.base-url=${NEMO_GUARDRAILS_URL:http://localhost:8000}
guardrails.request-timeout-ms=${GUARDRAILS_REQUEST_TIMEOUT_MS:30000}
# Guardrail checks share the application budgets. Rates are configured per 1,000 tokens.
# The adapter may report usage.prompt_tokens/completion_tokens; otherwise settle this estimate.
# Overhead/output estimates are not a remote NeMo token cap or a provider billing guarantee.
guardrails.cost.model=${GUARDRAILS_COST_MODEL:gpt-4o-mini}
# gpt-4o-mini standard text prices: $0.15/$0.60 per 1M tokens -> divide by 1,000 for per-1K rates.
guardrails.cost.input-usd-per-1k-tokens=${GUARDRAILS_INPUT_USD_PER_1K_TOKENS:0.00015}
guardrails.cost.output-usd-per-1k-tokens=${GUARDRAILS_OUTPUT_USD_PER_1K_TOKENS:0.00060}
guardrails.cost.prompt-overhead-tokens=${GUARDRAILS_PROMPT_OVERHEAD_TOKENS:256}
guardrails.cost.estimated-output-tokens=${GUARDRAILS_ESTIMATED_OUTPUT_TOKENS:512}

# OpenAI-compatible LLM endpoint. Keep the API key outside Git.
llm.base-url=${LLM_BASE_URL:https://api.openai.com}
llm.api-key=${LLM_API_KEY:}

# P03: server-only credentials. Results are collected from NAVER public web search, not scraped pages.
search.enabled=${SEARCH_ENABLED:true}
search.naver.base-url=${NAVER_SEARCH_BASE_URL:https://openapi.naver.com}
search.naver.client-id=${NAVER_SEARCH_CLIENT_ID:}
search.naver.client-secret=${NAVER_SEARCH_CLIENT_SECRET:}
search.max-results=${SEARCH_MAX_RESULTS:3}
search.request-timeout-ms=${SEARCH_REQUEST_TIMEOUT_MS:10000}
search.execution-timeout-ms=${SEARCH_EXECUTION_TIMEOUT_MS:180000}
llm.model=${LLM_MODEL:gpt-4o-mini}
llm.system-prompt=${LLM_SYSTEM_PROMPT:You are a cautious legal procedure assistant. Provide general legal information, avoid definitive outcomes, protect personal data, and recommend a qualified professional for case-specific advice.}
# Total generated-token limit includes visible text and reasoning; also used for cost reservation.
llm.max-output-tokens=${LLM_MAX_OUTPUT_TOKENS:2048}
llm.request-timeout-ms=${LLM_REQUEST_TIMEOUT_MS:30000}
# Split the fully checked and privacy-masked answer into SSE events after generation completes.
llm.streaming.chunk-size=${LLM_STREAMING_CHUNK_SIZE:50}

# Application-side cost control. Prices are configurable estimates for the selected model.
llm.cost.monthly-budget-usd=${LLM_MONTHLY_BUDGET_USD:2}
llm.cost.daily-budget-usd=${LLM_DAILY_BUDGET_USD:0.50}
llm.cost.session-budget-usd=${LLM_SESSION_BUDGET_USD:0.12}
# The calculator divides by 1,000; these defaults are prices per 1,000 tokens, not per 1M.
llm.cost.input-usd-per-1k-tokens=${LLM_INPUT_USD_PER_1K_TOKENS:0.00015}
llm.cost.output-usd-per-1k-tokens=${LLM_OUTPUT_USD_PER_1K_TOKENS:0.00060}
# One logical input page = 100 UTF-16 units, matching classification/intake/chat DTO limits.
# This rejects oversized stories; it does not split them into pages or represent billed tokens.
llm.cost.max-input-pages=${LLM_MAX_INPUT_PAGES:1}
llm.cost.estimated-chars-per-page=${LLM_ESTIMATED_CHARS_PER_PAGE:100}
