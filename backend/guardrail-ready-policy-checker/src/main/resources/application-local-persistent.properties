# Explicit local profile. Initialize/migrate a separate file database before starting.
# Private files stay below .local; this does not switch the default or MySQL profile.
spring.datasource.url=jdbc:h2:file:${LOCAL_H2_DB_PATH:./.local/runtime/legal-intake};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false
