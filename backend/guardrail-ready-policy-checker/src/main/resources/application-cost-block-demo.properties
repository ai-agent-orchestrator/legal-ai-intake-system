# Non-billable budget-block demonstration. Use only this profile, without the mysql profile.
# A 0.00001 USD session cannot reserve even the first input Guard at the configured rates.
llm.cost.session-budget-usd=0.00001
llm.cost.input-usd-per-1k-tokens=0.00015
llm.cost.output-usd-per-1k-tokens=0.00060
guardrails.cost.input-usd-per-1k-tokens=0.00015
guardrails.cost.output-usd-per-1k-tokens=0.00060
guardrails.cost.prompt-overhead-tokens=256
guardrails.cost.estimated-output-tokens=32
# Isolate the demo even when credentials exist in the parent environment.
llm.base-url=http://127.0.0.1:1
guardrails.base-url=http://127.0.0.1:1
search.enabled=false
server.address=127.0.0.1
