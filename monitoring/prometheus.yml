# Reuses C:/monitoring/prometheus/prometheus.exe. Original config/TSDB stay untouched.
# Run Start-LocalPrometheus.ps1 with the existing Actuator ADMIN credentials.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: legal-ai-intake
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    basic_auth:
      username: admin
      password_file: .runtime/actuator.password
    static_configs:
      - targets: ['127.0.0.1:8080']
        labels:
          instance_name: legal-intake-local
